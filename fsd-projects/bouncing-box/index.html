<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>

  <style>
    .box {
      width: 100px;
      height: 100px;
            border: 5px solid  #99ddff;      border-radius: 50%;      position: absolute;      top: 200px;      left: 0px;      user-select: none;      display: block;      font-weight: bold;      text-align: center;      line-height: 100px;      color:  #0066cc;      font-size: 250%;      font-family: Arial, sans-serif;      height: 100px;      background-color:  #e6f7ff; 
      
      background-color: #e6f7ff;
      color: #0066cc;
      font-size: 250%;
      font-family: Arial, sans-serif;
      font-weight: bold;
      text-align: center;
      line-height: 100px;
      user-select: none;
      display: block;
      position: absolute;
      top: 200px;
      left: 0px;
      border: 5px solid #99ddff;
      border-radius: 50%;
    }

    .board {
      height: 100vh;
      background: linear-gradient(to bottom, #dff6ff, #9adfff, #66c7ff);
    }
  </style>
</head>

<body class="board">
  <div class="box">🧊</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      var box = jQuery(".box");
      var board = jQuery(".board");
      var boardWidth = board.width();

      jQuery(window).on("resize", function () {
        boardWidth = board.width();
      });

      setInterval(update, 50);
      box.on("click", handleBoxClick);

      function moveBoxTo(newPositionX) {
        box.css("left", newPositionX);
      }

      function changeBoxText(newText) {
        box.text(newText);
      }

      // VARIABLES
      var positionX = 0;
      var points = 0;
      var speed = 10;

      function update() {
        positionX += speed;

        if (positionX > boardWidth - 100) {
          speed *= -1;
        }

        if (positionX < 0) {
          speed *= -1;
        }

        moveBoxTo(positionX);
      }

      function handleBoxClick() {
        positionX = 0;

        points++;

        speed = 3 * points + 10;

        changeBoxText(points);
      }

    })();
  </script>
</body>

</html>
